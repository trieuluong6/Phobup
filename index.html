<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Lyrics Copyright Bypass Tool</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --button-bg: #6200ee;
            --button-hover: #3700b3;
            --text-color: #e0e0e0;
            --border-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h2 { color: #fff; text-align: center; margin-bottom: 20px; }
        .container { display: flex; flex-direction: column; gap: 15px; }
        .group { display: flex; flex-direction: column; gap: 6px; }
        label.title { font-weight: bold; font-size: 14px; color: #aaa; }
        textarea {
            width: 100%;
            height: 180px;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: 1px solid var(--accent-color); }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .options label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
        button {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--button-hover); }
        .btn-copy { background-color: #03dac6; color: #000; }
        .btn-copy:hover { background-color: #018786; }
    </style>
</head>
<body>

    <h2>Suno Copyright Bypass Tool</h2>

    <div class="container">
        <div class="group">
            <label class="title">Lời bài hát gốc (Bị dính bản quyền):</label>
            <textarea id="inputText" placeholder="Dán lời bài hát bị Suno chặn vào đây..."></textarea>
        </div>

        <div class="options">
            <label><input type="checkbox" id="optZws" checked> Phá cụm từ (Zero-Width Space)</label>
            <label><input type="checkbox" id="optHomoglyph" checked> Thế ký tự đồng dạng Cyrillic (~25%)</label>
            <label><input type="checkbox" id="optAdlib" checked> Chèn Ad-lib ngẫu nhiên (~30%)</label>
        </div>

        <button onclick="processLyrics()">Xử lý lách bản quyền</button>

        <div class="group">
            <label class="title">Lời bài hát đã tối ưu (Dán vào Suno):</label>
            <textarea id="outputText" readonly placeholder="Kết quả sẽ xuất hiện ở đây..."></textarea>
        </div>

        <button class="btn-copy" onclick="copyResult()">Sao chép kết quả</button>
    </div>

    <script>
        function bypassSunoCopyright(lyrics, config) {
            const adlibs = [' (yeah)', ' (oh)', ' ~', ' (hmm)', ' (ooh)'];
            const homoglyphs = {
                'a': 'а', 'e': 'е', 'o': 'о',
                'i': 'і', 'c': 'с', 'p': 'р'
            };

            return lyrics.split('\n').map(line => {
                let trimmed = line.trim();
                
                // Giữ nguyên các thẻ cấu trúc của Suno như [Verse], [Chorus]
                if (!trimmed || /^\[.*\]$/i.test(trimmed)) {
                    return line;
                }

                let processed = trimmed;

                // 1. Phá chuỗi N-Gram bằng Zero-Width Space (\u200B)
                if (config.useZws) {
                    processed = processed.split(' ').join('\u200B ');
                }

                // 2. Thay thế ngẫu nhiên nguyên âm/phụ âm bằng Unicode Homoglyphs
                if (config.useHomoglyph) {
                    processed = processed.replace(/[aeicp]/gi, (char) => {
                        const lower = char.toLowerCase();
                        if (Math.random() < 0.25 && homoglyphs[lower]) {
                            const replacement = homoglyphs[lower];
                            return char === char.toUpperCase() ? replacement.toUpperCase() : replacement;
                        }
                        return char;
                    });
                }

                // 3. Chèn thêm Ad-lib làm lệch Vector Similarity
                if (config.useAdlib && Math.random() < 0.30) {
                    const randomAdlib = adlibs[Math.floor(Math.random() * adlibs.length)];
                    processed += randomAdlib;
                }

                return processed;
            }).join('\n');
        }

        function processLyrics() {
            const input = document.getElementById('inputText').value;
            const config = {
                useZws: document.getElementById('optZws').checked,
                useHomoglyph: document.getElementById('optHomoglyph').checked,
                useAdlib: document.getElementById('optAdlib').checked
            };

            const result = bypassSunoCopyright(input, config);
            document.getElementById('outputText').value = result;
        }

        function copyResult() {
            const output = document.getElementById('outputText');
            if (!output.value) return;
            
            output.select();
            navigator.clipboard.writeText(output.value);
            alert('Đã sao chép lời bài hát đã xử lý vào bộ nhớ tạm!');
        }
    </script>
</body>
</html>
